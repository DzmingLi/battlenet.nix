name: Evaluate overlay
on:
  push:
    branches: [main]
    paths-ignore:
      - "games/**"
  pull_request:
concurrency:
  group: evaluate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix develop .#ci --command python3 -m unittest discover -s tests -v
      - run: nix develop .#ci --command nu --no-config-file -c 'use ./update.nu validate; validate'
      - run: nix develop .#ci --command nu --no-config-file update.nu --help
